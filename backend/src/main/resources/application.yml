server:
  port: 8080
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true      # JS에서 세션 쿠키 접근 불가 (XSS로 세션 탈취 방지)
        same-site: lax       # 다른 사이트에서 보낸 요청엔 쿠키 미전송 (CSRF 완화)

spring:
  datasource:
    # 개발용 H2 (프로젝트 폴더의 data/ 에 파일로 저장됨)
    url: jdbc:h2:file:./data/approvaldb;MODE=MySQL
    username: sa
    password:
    # --- MySQL 사용 시 ---
    # url: jdbc:mysql://localhost:3306/approval?serverTimezone=Asia/Seoul
    # username: approval
    # password: 비밀번호
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

app:
  setup:
    # 최초 대표 등록 토큰. 비워 두면 서버가 시작할 때 무작위 토큰을 만들어 터미널에 출력한다.
    # 직접 정하려면 실행 전에 환경변수 CEO_SETUP_TOKEN 을 설정 (PowerShell: $env:CEO_SETUP_TOKEN="원하는값")
    token: ${CEO_SETUP_TOKEN:}
  upload:
    dir: ./uploads          # 결재 첨부파일·메신저 파일(암호문) 저장 폴더
  messenger:
    file-retention-days: 7  # 메신저로 보낸 파일 보관 기간(일). 지나면 자동 삭제
